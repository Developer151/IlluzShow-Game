<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Illusion Show - Корабль Земля</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Слой спрайта (2 слой) */
        #sprite-layer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sprite-layer.visible {
            opacity: 0.3;
        }

        .sprite-placeholder {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(128, 0, 128, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }

        /* Слой текста (1 слой) */
        #text-layer {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #game-output {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        #input-area {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid #333;
            position: sticky;
            bottom: 0;
        }

        #command-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #0f0;
            font-family: inherit;
            font-size: 16px;
            padding: 10px;
            outline: none;
        }

        #command-input::placeholder {
            color: #555;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #0f0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #2a2a2a;
            border-color: #0f0;
        }

        /* Цвета */
        .color-reset { color: #e0e0e0; }
        .color-bold { font-weight: bold; }
        .color-dim { opacity: 0.7; }
        .color-red { color: #ff6b6b; }
        .color-green { color: #51cf66; }
        .color-yellow { color: #fcc419; }
        .color-blue { color: #74c0fc; }
        .color-magenta { color: #cc5de8; }
        .color-cyan { color: #63e6be; }
        .color-white { color: #f8f9fa; }
        .color-gray { color: #868e96; }
        .color-violet { color: #a610c7; }
        .color-lime { color: #94d82d; }
        .color-black { color: #000000; }

        /* Анимации текста */
        .typing {
            overflow: hidden;
            border-right: 2px solid #0f0;
            white-space: pre-wrap;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* HUD */
        .hud-header {
            border: 2px solid #63e6be;
            padding: 10px;
            margin: 10px 0;
            text-align: center;
        }

        .hud-line {
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }

        .hud-line:last-child {
            border-bottom: none;
        }

        /* Шкалы */
        .bar-container {
            display: inline-block;
        }

        .bar-10 {
            letter-spacing: 2px;
        }

        /* Кнопки выбора */
        .choice-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .choice-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #63e6be;
            color: #63e6be;
            padding: 12px 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            text-align: left;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: rgba(99, 230, 182, 0.2);
            transform: translateX(5px);
        }

        /* Скроллбар */
        #game-output::-webkit-scrollbar {
            width: 8px;
        }

        #game-output::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        #game-output::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        #game-output::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            #sprite-layer {
                width: 250px;
                height: 250px;
            }

            #text-layer {
                padding: 10px;
            }

            #input-area {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>

        async function printSlow(text, delay = 25, className = '') {
            return new Promise(resolve => {
                const div = document.createElement('div');
                div.className = className;
                output.appendChild(div);

                let i = 0;
                function type() {
                    if (i < text.length) {
                        div.textContent += text.charAt(i);
                        i++;
                        output.scrollTop = output.scrollHeight;
                        typingTimeout = setTimeout(type, delay);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        function stopTyping() {
            if (typingTimeout) {
                clearTimeout(typingTimeout);
                typingTimeout = null;
            }

        function header(title) {
            const w = 50;
            print('═'.repeat(w), 'color-cyan');
            print(`║${title.centerPad(w - 2)}║`, 'color-cyan color-bold');
            print('═'.repeat(w), 'color-cyan');
        }

        String.prototype.centerPad = function(totalWidth) {
            const str = this.toString();
            const padding = totalWidth - str.length;
            const left = Math.floor(padding / 2);
            const right = padding - left;
            return ' '.repeat(Math.max(0, left)) + str + ' '.repeat(Math.max(0, right));
        };

                case 'tunnel':
                    return 'radial-gradient(circle at center, rgba(255, 255, 255, 0.5) 0%, rgba(100, 100, 100, 0.2) 50%, transparent 100%)';
                default:
                    return 'transparent';
            }

        function forceBar5(value, filledColor, emptyColor) {
            const tens = Math.floor(value / 10);
            const rem = value % 10;
            let top, bottom;

            if (rem === 0) {
                top = tens;
                bottom = tens;
            } else if (rem <= 5) {
                top = tens + 1;
                bottom = tens;
            } else {
                top = tens + 1;
                bottom = tens + 1;
            }

            top = Math.min(10, Math.max(0, top));
            bottom = Math.min(10, Math.max(0, bottom));

            const topLine = `${filledColor}${'■'.repeat(top)}${emptyColor}${'■'.repeat(10 - top)}`;
            const bottomLine = `${filledColor}${'■'.repeat(bottom)}${emptyColor}${'■'.repeat(10 - bottom)}`;

            return [topLine, bottomLine];
        }

        function choiceInput(prompt, options) {
            return new Promise(resolve => {
                print('', 'color-yellow');
                print(`${prompt}`, 'color-yellow');

                const container = document.createElement('div');
                container.className = 'choice-buttons';

                options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = `[${i + 1}] ${opt}`;
                    btn.onclick = () => {
                        container.remove();
                        resolve(i);
                    };
                    container.appendChild(btn);
                });

                output.appendChild(container);
                output.scrollTop = output.scrollHeight;
            });
        }

        function waitEnter(promptText = '') {
            return new Promise(resolve => {
                if (promptText) {
                    print(promptText, 'color-gray');
                }

                const handler = (e) => {
                    if (e.key === 'Enter') {
                        commandInput.removeEventListener('keydown', handler);
                        resolve();
                    }
                };

                commandInput.addEventListener('keydown', handler);
                commandInput.focus();
            });
        }

        // ==================== ОБРАБОТКА КОМАНД ====================
        const COMMANDS = [
            "help", "profile", "stats", "explore", "work",
            "sleep", "inventory", "achievements", "die",
            "save", "quit", "exit", "q"
        ];

        function findCommand(cmdInput) {
            if (!cmdInput) return null;

            cmdInput = cmdInput.trim().toLowerCase();

            if (COMMANDS.includes(cmdInput)) return cmdInput;

            const matches = COMMANDS.filter(c => c.startsWith(cmdInput));

            if (matches.length === 1) return matches[0];
            if (matches.length > 1) {
                print(`Неоднозначный ввод. Возможные варианты: ${matches.join(', ')}`, 'color-yellow');
                return null;
            }
            return null;
        }

        async function processCommand(cmd) {
            stopTyping();

            switch(cmd) {
                case 'help':
                    showHelp();
                    break;
                case 'profile':
                    showProfile();
                    break;
                case 'stats':
                    showStats();
                    break;
                case 'explore':
                    await explore();
                    break;
                case 'work':
                    await work();
                    break;
                case 'sleep':
                    await sleepFunc();
                    break;
                case 'inventory':
                    showInventory();
                    break;
                case 'achievements':
                    showAchievements();
                    break;
                case 'die':
                    await dieFunc();
                    break;
                case 'save':
                    saveGame();
                    await sleep(1000);
                    break;
                case 'quit':
                case 'exit':
                case 'q':
                    saveGame();
                    cls();
                    print('Сознание уходит в тишину...', 'color-gray');
                    inputArea.style.display = 'none';
                    break;
                default:
                    print('Неизвестная команда. Введи help для справки.', 'color-red');
                    await sleep(1000);
            }

            if (cmd !== 'quit' && cmd !== 'exit' && cmd !== 'q' && gameState.alive) {
                showHUD();
                print('Введи команду (help — справка)', 'color-gray');
            }

            commandInput.value = '';
            commandInput.focus();
        }

        async function initGame() {
            commandInput.addEventListener('keydown', async (e) => {
                if (e.key === 'Enter' && commandInput.value.trim()) {
                    const cmd = findCommand(commandInput.value);
                    if (cmd) {
                        await processCommand(cmd);
                    } else if (commandInput.value.trim() !== '') {
                        print('Неизвестная команда. Введи help для справки.', 'color-red');
                        commandInput.value = '';
                    }
                }
            });

            // Проверка сохранения
            if (loadGame()) {
                cls();
                print(`💾 Найдено сохранение: ${gameState.consciousness_id}`, 'color-green');

                const idx = await choiceInput('Что делаем?', ['Продолжить', 'Новая игра', 'Удалить сохранение']);

                if (idx === 1) {
                    deleteSave();
                    gameState = {
                        consciousness_id: "", is_engineer: false, avatar_name: "", country: "",
                        city: "", location: "", settlement_type: "", party_number: 0, party_count: 0,
                        scenario: ["", "", ""], darkness: 50, light: 50, illusion_level: 5000,
                        party_direction: "neutral", stats: { intellect: 10, morality: 10, emotions: 10, awareness: 0, violations: 0 },
                        start_stats: {}, inventory: [], visited_countries: new Set(), visited_cities: new Set(),
                        visited_locations: new Set(), rebirth_count: 0, death_count: 0, age: 0, alive: true,
                        in_purgatory: false, kz_verdict: "", history: [], color_scheme: "violet_green"
                    };
                } else if (idx === 2) {
                    deleteSave();
                    gameState = {
                        consciousness_id: "", is_engineer: false, avatar_name: "", country: "",
                        city: "", location: "", settlement_type: "", party_number: 0, party_count: 0,
                        scenario: ["", "", ""], darkness: 50, light: 50, illusion_level: 5000,
                        party_direction: "neutral", stats: { intellect: 10, morality: 10, emotions: 10, awareness: 0, violations: 0 },
                        start_stats: {}, inventory: [], visited_countries: new Set(), visited_cities: new Set(),
                        visited_locations: new Set(), rebirth_count: 0, death_count: 0, age: 0, alive: true,
                        in_purgatory: false, kz_verdict: "", history: [], color_scheme: "violet_green"
                    };
                } else if (idx === null) {
                    cls();
                    print('До встречи.', 'color-gray');
                    return;
                }
            }

            if (!gameState.consciousness_id) {
                gameState.color_scheme = await chooseColorScheme();
                print('');
                await sleep(500);
                await registrationScene();
            } else {
                createAvatar();
            }
        }

        // Запуск при загрузке страницы
        window.onload = initGame;
    </script>
</body>
</html>
